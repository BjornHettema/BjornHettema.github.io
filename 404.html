<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Not found — Bjorn Hettema</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Karla:wght@400;600&display=swap">
<style>
  :root{color-scheme:light;--bg:#F6F4F0;--ink:#222B2A;--muted:#5E6B68;--accent:#2F6F62;--line:#DFDCD4;--surface:#FFF}
  @media (prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#141A19;--ink:#E9EEEC;--muted:#9EACA8;--accent:#74B7A6;--line:#2C3836;--surface:#1C2423}}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:Karla,system-ui,sans-serif;
    min-height:100vh;display:grid;place-items:center;padding:24px 16px;line-height:1.65}
  .box{max-width:30em;text-align:left}
  h1{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:clamp(28px,6vw,42px);
    line-height:1.1;margin:0 0 14px;letter-spacing:-.02em}
  p{color:var(--muted);margin:0 0 22px}
  a.btn{display:inline-block;text-decoration:none;font-weight:600;font-size:15px;
    background:var(--accent);color:var(--bg);border-radius:999px;padding:11px 20px}
  .code{font-size:13px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin:0 0 10px}
</style>
</head>
<body>
  <div class="box">
    <p class="code">Error 404</p>
    <h1>That page isn't on the map.</h1>
    <p>The link may be out of date, or I may have moved something. The work is all on the main page.</p>
    <a class="btn" href="/">Back to the start</a>
  </div>
</body>
</html>
